      { id: "psy-2", topic: "direction", day: 1, question: "ஒருவர் தனது வீட்டிலிருந்து தெற்கு நோக்கி 4 கிமீ நடந்து, பின் இடதுபுறம் திரும்பி 3 கிமீ நடக்கிறார் எனில், தொடக்கப் புள்ளியிலிருந்து உள்ள குறைந்தபட்ச தூரம் யாது?", options: ["5 கிமீ", "7 கிமீ", "6 கிமீ", "4.5 கிமீ"], correctAnswer: 0, explanation: "பித்தாகரஸ் தேற்றம்: √(4² + 3²) = √(16 + 9) = √25 = 5 கிமீ." },
      { id: "psy-3", topic: "direction", day: 1, question: "சூரிய உதயத்தின் போது ரவி ஒரு கம்பத்தை நோக்கி நிற்கிறார். கம்பத்தின் நிழல் அவரது வலதுபுறம் விழுகிறது எனில், ரவி நோக்கும் திசை யாது?", options: ["வடக்கு", "தெற்கு", "கிழக்கு", "மேற்கு"], correctAnswer: 1, explanation: "காலையில் நிழல் மேற்கில் விழும். நிழல் வலதுபுறம் இருக்க வேண்டுமானால் அவர் தெற்கு நோக்கி நிற்க வேண்டும்." },

      { id: "psy-5", topic: "direction", day: 1, question: "ஒருவர் வடகிழக்கு (North-East) நோக்கி நிற்கிறார். அவர் கடிகார முள் திசையில் (Clockwise) 90° திரும்பினால் நோக்கும் திசை யாது?", options: ["தென்கிழக்கு", "தென்மேற்கு", "வடமேற்கு", "கிழக்கு"], correctAnswer: 0, explanation: "வடகிழக்கு (45°) + 90° = 135° = தென்கிழக்கு (South-East)." },
      { id: "psy-6", topic: "direction", day: 1, question: "ஒருவர் மேற்கை நோக்கி நிற்கிறார். அவர் கடிகார முள் எதிர் திசையில் (Anticlockwise) 135° திரும்பினால் நோக்கும் திசை என்ன?", options: ["தென்கிழக்கு", "தென்மேற்கு", "வடகிழக்கு", "வடமேற்கு"], correctAnswer: 0, explanation: "மேற்கிலிருந்து இடதுபுறம் 135° திரும்பினால் தென்கிழக்கு (South-East)." },
      { id: "psy-7", topic: "direction", day: 1, question: "A என்பவர் Bக்கு கிழக்கே 6 கிமீ தூரத்திலும், C என்பவர் Bக்கு வடக்கே 8 கிமீ தூரத்திலும் இருந்தால், A மற்றும் Cக்கு இடையேயான தூரம் யாது?", options: ["10 கிமீ", "12 கிமீ", "14 கிமீ", "16 கிமீ"], correctAnswer: 0, explanation: "AC = √(6² + 8²) = √(36 + 64) = √100 = 10 கிமீ." },
      { id: "psy-8", topic: "direction", day: 1, question: "கடிகாரத்தில் நேரம் 4:30. நிமிட முள் கிழக்கு திசையைக் காட்டினால் மணி முள் எந்த திசையைக் காட்டும்?", options: ["வடகிழக்கு", "தென்கிழக்கு", "தென்மேற்கு", "வடமேற்கு"], correctAnswer: 0, explanation: "6 மணி பகுதி கிழக்கு எனில் 4:30 பகுதி வடகிழக்கு (North-East) திசையைக் காட்டும்." },

      { id: "chem-2", topic: "air", day: 1, question: "சூரியனிலிருந்து வரும் தீங்கு விளைவிக்கும் UV கதிர்களை உறிஞ்சும் வளிமண்டல அடுக்கு எது?", options: ["ட்ரோபோஸ்பியர்", "ஸ்ட்ரேடோஸ்பியர் (Stratosphere)", "மீசோஸ்பியர்", "தெர்மோஸ்பியர்"], correctAnswer: 1, explanation: "ஸ்ட்ரேடோஸ்பியர் அடுக்கில் ஓசோன் படலம் (O3) புற ஊதாக் கதிர்களை உறிஞ்சுகிறது." },

        difficulty: "நடுத்தரம் (Moderate)",
        badge: "Concepts",
        questionCount: 10,
        durationMinutes: 10,
        description: "பயிற்சிக் கணக்குகள், 2-படி தீர்வுகள் மற்றும் கருத்து வினாக்கள்."
      },
      {
        level: 3,
        titleTamil: "நிலை 3: தந்திரமான & குறுக்குவழி வினாக்கள்",
        titleEnglish: "Level 3: Tricky & Shortcut Speed Math",
        difficulty: "தந்திரமானது (Tricky)",
        badge: "Tricky Core",
        questionCount: 10,
        durationMinutes: 12,
        description: "SI தேர்வில் கேட்கப்படும் ட்ரிக்கியான வினாக்கள் மற்றும் Shortcut முறைகள்."
      },
      {
        level: 4,
        titleTamil: "நிலை 4: உயர் கடினத்தன்மை வினாக்கள்",
        titleEnglish: "Level 4: Advanced High-Difficulty Challenge",
        difficulty: "கடினம் (Hard)",
        badge: "Advanced",
        questionCount: 10,
        durationMinutes: 15,
        description: "சிக்கலான கணக்குகள், தீவிர யோசனை தேவைப்படும் வினாக்கள்."
      },
      {
        level: 5,
        titleTamil: "நிலை 5: SI இறுதி மாதிரி முழுத் தேர்வு",
        titleEnglish: "Level 5: Master SI Exam Simulation",
        difficulty: "தேர்வுத்தரம் (Master SI)",
        badge: "Grand Master",
        questionCount: 10,
        durationMinutes: 15,
        description: "TNUSRB SI அசல் தேர்வுத் தரம் வாய்ந்த இறுதி மாதிரித் தேர்வு."
      }
    ];

    function App() {
      const [currentView, setCurrentView] = useState("home"); // "home" | "topic" | "levels" | "test" | "result" | "progress"
      const [activeTopicId, setActiveTopicId] = useState("simplification");
      const [activeDay, setActiveDay] = useState(1);
      const [activeLevel, setActiveLevel] = useState(1);
      
      // LocalStorage for Level Progress
      const [completedLevels, setCompletedLevels] = useState(() => {
        try {
          const raw = localStorage.getItem("si_completed_levels");
          return raw ? JSON.parse(raw) : {};
        } catch(e) {
          return {};
        }
      });

      // Test states
      const [testState, setTestState] = useState("instructions");
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isAnswerRevealed, setIsAnswerRevealed] = useState(false);
      const [score, setScore] = useState(0);
      const [feedbackMsg, setFeedbackMsg] = useState("");
      const [secondsLeft, setSecondsLeft] = useState(600);
      const [timerRunning, setTimerRunning] = useState(false);
      const [lastResult, setLastResult] = useState(null);
      const [showExitModal, setShowExitModal] = useState(false);

      // Save levels to localStorage
      const recordLevelCompletion = (topicId, day, lvl, scoreNum, total) => {
        const key = `${topicId}-${day}-${lvl}`;
        const newLevels = {
          ...completedLevels,
          [key]: { score: scoreNum, total, percentage: Math.round((scoreNum / total) * 100), date: new Date().toISOString() }
        };
        setCompletedLevels(newLevels);
        try {
          localStorage.setItem("si_completed_levels", JSON.stringify(newLevels));
        } catch(e) {}
      };

      // Check if a level is unlocked
      const isLevelUnlocked = (topicId, day, lvl) => {
        if (lvl <= 1) return true;
        const prevKey = `${topicId}-${day}-${lvl - 1}`;
        return !!completedLevels[prevKey];
      };

      // Get questions for active level
      const currentQuestions = useMemo(() => {
        let pool = [];
        if (activeTopicId === "simplification") pool = SIMPLIFICATION_DATA;
        else if (activeTopicId === "profit-loss") pool = PROFIT_LOSS_DATA;
        else if (activeTopicId === "special-series") pool = SPECIAL_SERIES_DATA;
        else pool = OTHER_SUBJECTS_DATA.filter(q => q.topic === activeTopicId);

        // Level-based questions
        const dayQs = pool.filter(q => q.day === (activeLevel || activeDay));
        if (dayQs.length > 0) return dayQs;
        return pool.slice(0, 10);
      }, [activeTopicId, activeDay, activeLevel]);

      // Timer
      useEffect(() => {
        if (!timerRunning) return;
        const interval = setInterval(() => {
          setSecondsLeft(prev => {
            if (prev <= 1) {
              clearInterval(interval);
              finishTest();
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [timerRunning]);

      const navigateTo = (view, topicId = null, day = null, level = null) => {
        if (topicId) setActiveTopicId(topicId);
        if (day !== null) setActiveDay(day);
        if (level !== null) setActiveLevel(level);
        setCurrentView(view);
        setTestState("instructions");
        setShowExitModal(false);
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const startQuiz = () => {
        setTestState("playing");
        setCurrentQIndex(0);
        setSelectedOption(null);
        setIsAnswerRevealed(false);
        setScore(0);
        setFeedbackMsg("");
        setSecondsLeft(600);
        setTimerRunning(true);
      };

      const handleOptionSelect = (index) => {
        if (isAnswerRevealed) return;
        const q = currentQuestions[currentQIndex];
        const isCorrect = index === q.correctAnswer;

        setSelectedOption(index);
        setIsAnswerRevealed(true);
        if (isCorrect) setScore(s => s + 1);

        const msg = getUserFeedback(isCorrect);
        setFeedbackMsg(msg);
      };

      const handleNextQuestion = () => {
        if (currentQIndex < currentQuestions.length - 1) {
          setCurrentQIndex(prev => prev + 1);
          setSelectedOption(null);
          setIsAnswerRevealed(false);
          setFeedbackMsg("");
        } else {
          finishTest();
        }
      };

      const finishTest = () => {
        setTimerRunning(false);
        const finalScore = score + (selectedOption === currentQuestions[currentQIndex]?.correctAnswer && !isAnswerRevealed ? 1 : 0);
        
        recordLevelCompletion(activeTopicId, activeDay, activeLevel, score, currentQuestions.length);

        setLastResult({
          topicId: activeTopicId,
          day: activeDay,
          level: activeLevel,
          score,
          total: currentQuestions.length,
          percentage: Math.round((score / currentQuestions.length) * 100)
        });
        setCurrentView("result");
      };

      const currentTopic = useMemo(() => {
        for (const sub of SUBJECTS) {
          const t = sub.topics.find(top => top.id === activeTopicId);
          if (t) return { ...t, subjectNameTamil: sub.nameTamil };
        }
        return SUBJECTS[0].topics[0];
      }, [activeTopicId]);

      const mathSubject = SUBJECTS.find(s => s.id === "mathematics");
      const otherSubjects = SUBJECTS.filter(s => s.id !== "mathematics");

      return (

              <div 
                className="flex items-center space-x-3 cursor-pointer"
                onClick={() => navigateTo("home")}
              >
                <span className="text-2xl">🚔</span>
                <div>

                    <span className="font-extrabold text-base sm:text-lg tracking-tight">SI TEST</span>
                    <span className="bg-blue-500/20 text-blue-300 text-[10px] px-2 py-0.5 rounded-full font-bold">5 LEVELS</span>
                  </div>
                  <p className="text-[11px] text-slate-400">தமிழ்நாடு SI தேர்வு பயிற்சி</p>

                  }`}
                >
                  முகப்பு
                </button>
                <button
                  onClick={() => navigateTo("progress")}
                  className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-colors ${
                    currentView === "progress" ? "bg-blue-600 text-white" : "text-slate-300 hover:text-white"
                  }`}
                >
                  📊 முன்னேற்றம்
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-8">

                  {/* Motivation Banner */}

                      💬 இன்று புத்தகம் திறக்குற அந்த 1 மணி நேரம்… <strong className="text-blue-700 font-extrabold">நாளைக்கு உன் வாழ்க்கையை திறக்குற சாவியா இருக்கலாம்!</strong> 🚔🔥
                    </p>
                  </div>
                </div>

                {/* Mathematics Section */}
                <div>
                  <div className="mb-4">
                    <h2 className="text-xl sm:text-2xl font-bold text-slate-900 flex items-center space-x-2">

                    <p className="text-xs text-slate-500">ஒவ்வொரு நாளும் 5 நிலைகளில் முந்தைய level முடித்து அடுத்த level-ஐ unlock செய்யும் பயிற்சி</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                    {mathSubject?.topics.map(topic => (
                      <div

                  </div>

              </div>

            {currentView === "topic" && (

                  >
                    <span>←</span>
                    <span>நாள் அட்டவணைக்குத் திரும்பு</span>
                  </button>
                  <span className="text-xs font-bold text-blue-700 bg-blue-50 px-3.5 py-1.5 rounded-full border border-blue-200">
                    {currentTopic?.nameTamil} &gt; நாள் {activeDay} (5 Levels)
                  </span>
                </div>

                {/* Banner */}
                <div className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 rounded-3xl p-6 sm:p-8 text-white shadow-xl">
                  <div className="inline-flex items-center space-x-2 bg-blue-500/20 border border-blue-400/30 px-3 py-1 rounded-full text-blue-300 text-xs font-bold mb-2">
                    <span>🚔</span>
                    <span>TNUSRB SI 5-STAGE PROGRESSION</span>
                  </div>
                  <h1 className="text-2xl sm:text-3xl font-black">
                    நாள் {activeDay} : 5-நிலை தொடர் பயிற்சி (Sequential Unlocking)
                  </h1>
                  <p className="text-xs sm:text-sm text-indigo-200 mt-2 max-w-2xl leading-relaxed">
                    Level 1 எப்போதும் திறந்திருக்கும். ஒவ்வொரு Level-ஐயும் முடித்தவுடன் அடுத்த Level தானாகவே Unlock ஆகும்!
                  </p>
                </div>

                {/* Levels Cards Grid */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {LEVELS_META.map(lvl => {
                    const unlocked = isLevelUnlocked(activeTopicId, activeDay, lvl.level);
                    const lvlResult = completedLevels[`${activeTopicId}-${activeDay}-${lvl.level}`];
                    const isCompleted = !!lvlResult;

                    return (
                      <div
                        key={lvl.level}
                        className={`rounded-3xl p-6 border transition-all flex flex-col justify-between ${
                          isCompleted
                            ? "bg-emerald-50/60 border-emerald-300 shadow-sm"
                            : unlocked
                            ? "bg-white border-blue-300 shadow-md hover:border-blue-500 hover:shadow-lg"
                            : "bg-slate-100 border-slate-200 opacity-75 cursor-not-allowed"
                        }`}
                      >
                        <div>
                          <div className="flex items-center justify-between mb-3">
                            <span className={`text-xs font-black px-3 py-1 rounded-xl border ${
                              isCompleted
                                ? "bg-emerald-100 text-emerald-800 border-emerald-300"
                                : unlocked
                                ? "bg-blue-100 text-blue-800 border-blue-200"
                                : "bg-slate-200 text-slate-500 border-slate-300"
                            }`}>
                              {isCompleted ? "✅ LEVEL " + lvl.level : unlocked ? "🔓 LEVEL " + lvl.level : "🔒 LEVEL " + lvl.level}

                              {lvl.badge}

                            <span>⏱ {lvl.durationMinutes} நிமிடம்</span>
                            <span className="text-blue-600">{lvl.difficulty.split(' ')[0]}</span>
                          </div>

                          {isCompleted && (

                            </div>
                          )}

                          <button
                            disabled={!unlocked}
                            onClick={() => unlocked && navigateTo("test", activeTopicId, activeDay, lvl.level)}
                            className={`w-full py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center space-x-2 transition-all ${
                              isCompleted
                                ? "bg-emerald-600 hover:bg-emerald-700 text-white"
                                : unlocked
                                ? "bg-blue-600 hover:bg-blue-700 text-white shadow"
                                : "bg-slate-300 text-slate-500 cursor-not-allowed"

                          >

            {/* ================= 4. TEST VIEW ================= */}

                    <div>
                      <h3 className="text-sm font-bold text-slate-800 mb-3">விதிமுறைகள்:</h3>
                      <ul className="space-y-2 text-xs sm:text-sm text-slate-600">
                        <li>• {currentQuestions.length} கொள்குறி வினாக்கள் (MCQ).</li>
                        <li>• சரியான பதில் கிளிக் செய்தவுடன் உடனடி விளக்கம் காட்டப்படும்.</li>
                        <li>• தவறான பதில் கொடுத்தாலும் சரியான பதிலும் விளக்கமும் காட்டப்படும்.</li>
                        <li>• இந்த Level-ஐ முடித்தவுடன் அடுத்த Level திறக்கப்படும்!</li>
                      </ul>
                    </div>

                    <button
                      onClick={startQuiz}
                      className="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm sm:text-base shadow transition-colors"
                    >
                      🚔 Level {activeLevel} தேர்வை தொடங்குகிறேன் →
                    </button>
                  </div>
                ) : (
                  <div className="space-y-5">
                    {/* Quiz Top Bar */}
                    <div className="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                      <div className="flex items-center space-x-3">
                        <button
                          onClick={() => setShowExitModal(true)}
                          className="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700"
                          title="தேர்விலிருந்து வெளியேறு"
                        >
                          ← பின்செல்
                        </button>
                        <span className="font-bold text-xs sm:text-sm text-slate-800">
                          {currentTopic?.nameTamil} • Level {activeLevel}
                        </span>
                      </div>
                      <div className="flex items-center space-x-3 text-xs sm:text-sm font-bold">
                        <span className="text-blue-600">மதிப்பெண்: {score}</span>
                        <span className="font-mono bg-slate-100 px-2 py-0.5 rounded border">⏱ {formatTime(secondsLeft)}</span>
                      </div>
                    </div>

                    {/* Exit Confirmation Modal */}
                    {showExitModal && (
                      <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 animate-fadeIn">
                        <div className="bg-white rounded-3xl p-6 sm:p-7 max-w-sm w-full border border-slate-200 shadow-2xl space-y-4 text-center">
                          <span className="text-3xl block">⚠️</span>
                          <h3 className="text-lg font-bold text-slate-900">தேர்விலிருந்து வெளியேறவா?</h3>
                          <p className="text-xs text-slate-600 leading-relaxed">
                            தற்போது வெளியேறினால் உங்கள் தேர்வு மதிப்பெண்கள் சேமிக்கப்படாது.
                          </p>
                          <div className="flex space-x-2 pt-2">
                            <button
                              onClick={() => setShowExitModal(false)}
                              className="flex-1 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs"
                            >
                              தொடர்க
                            </button>
                            <button
                              onClick={() => navigateTo("levels", activeTopicId, activeDay)}
                              className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs"
                            >
                              வெளியேறு
                            </button>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* Progress Bar */}
                    <div>
                      <div className="flex justify-between text-xs font-bold text-slate-500 mb-1">
                        <span>கேள்வி {currentQIndex + 1} / {currentQuestions.length}</span>
                        <span>{Math.round(((currentQIndex + 1) / currentQuestions.length) * 100)}%</span>
                      </div>
                      <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                        <div className="bg-blue-600 h-full transition-all" style={{ width: `${Math.round(((currentQIndex + 1) / currentQuestions.length) * 100)}%` }}></div>
                      </div>
                    </div>

                    {/* Question Card */}
                    {currentQuestions[currentQIndex] && (
                      <div className="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-sm">
                        <span className="text-xs font-bold text-blue-600 block mb-2">கேள்வி {currentQIndex + 1}</span>
                        <h3 className="text-base sm:text-xl font-bold text-slate-900 leading-relaxed">
                          {currentQuestions[currentQIndex].question}
                        </h3>
                      </div>
                    )}

                    {/* Options */}
                    {currentQuestions[currentQIndex] && (
                      <div className="space-y-2.5">
                        {currentQuestions[currentQIndex].options.map((opt, idx) => {
                          const isSelected = selectedOption === idx;
                          const isCorrect = idx === currentQuestions[currentQIndex].correctAnswer;
                          const letters = ["A", "B", "C", "D"];

                          let btnStyle = "bg-white border-slate-200 text-slate-800 hover:border-blue-400";
                          if (isAnswerRevealed) {
                            if (isCorrect) btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-950 font-bold";
                            else if (isSelected && !isCorrect) btnStyle = "bg-rose-50 border-rose-500 text-rose-950 font-bold animate-shake";
                            else btnStyle = "bg-slate-50 border-slate-200 text-slate-400";
                          }

                          return (
                            <button
                              key={idx}
                              onClick={() => handleOptionSelect(idx)}
                              disabled={isAnswerRevealed}
                              className={`w-full text-left p-3.5 rounded-xl border flex items-center justify-between transition-colors ${btnStyle}`}
                            >
                              <div className="flex items-center space-x-3">
                                <span className="w-7 h-7 rounded-lg bg-slate-100 text-slate-700 flex items-center justify-center font-bold text-xs">
                                  {letters[idx]}
                                </span>
                                <span className="text-sm sm:text-base font-medium">{opt}</span>
                              </div>
                              {isAnswerRevealed && isCorrect && <span className="text-emerald-600 font-bold text-xs">✓ சரி</span>}
                              {isAnswerRevealed && isSelected && !isCorrect && <span className="text-rose-600 font-bold text-xs">✕ தவறு</span>}
                            </button>
                          );
                        })}
                      </div>
                    )}

                    {/* Feedback & Solution Banner */}
                    {isAnswerRevealed && (
                      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden animate-fadeIn">
                        <div className={`p-4 text-white font-extrabold text-sm sm:text-base ${
                          selectedOption === currentQuestions[currentQIndex].correctAnswer ? "bg-emerald-600" : "bg-rose-600"
                        }`}>
                          <div className="flex items-center space-x-2">
                            <span>{selectedOption === currentQuestions[currentQIndex].correctAnswer ? "✅" : "⚠️"}</span>
                            <span>{feedbackMsg}</span>
                          </div>
                        </div>

                        <div className="p-4 sm:p-5 bg-slate-50 space-y-3">
                          <div className="text-xs sm:text-sm font-semibold text-slate-700 bg-white p-3 rounded-lg border border-slate-200">
                            <strong>சரியான விடை:</strong> {["A", "B", "C", "D"][currentQuestions[currentQIndex].correctAnswer]} — {currentQuestions[currentQIndex].options[currentQuestions[currentQIndex].correctAnswer]}
                          </div>

                          <div className="text-xs sm:text-sm text-slate-800 bg-white p-3.5 rounded-lg border border-slate-200 whitespace-pre-line leading-relaxed">
                            <strong className="text-blue-700 block mb-1">விளக்கம் (Solution):</strong>
                            {currentQuestions[currentQIndex].explanation}
                          </div>

                          <div className="text-right pt-2">
                            <button
                              onClick={handleNextQuestion}
                              className="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm shadow transition-colors"
                            >
                              {currentQIndex === currentQuestions.length - 1 ? "🏁 முடிவை காண்க" : "அடுத்த கேள்வி →"}
                            </button>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* ================= 5. RESULT VIEW ================= */}
            {currentView === "result" && lastResult && (
              <div className="max-w-md mx-auto py-6 animate-fadeIn">
                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm text-center space-y-5">
                  <span className="text-4xl block">🎉</span>
                  <h2 className="text-2xl font-black text-slate-900">
                    நிலை {lastResult.level} தேர்வு முடிந்தது!
                  </h2>
                  
                  {lastResult.level < 5 && (
                    <div className="bg-emerald-50 border border-emerald-300 text-emerald-900 p-3 rounded-xl text-xs font-bold">
                      🔓 வாழ்த்துகள்! அடுத்த நிலை (Level {lastResult.level + 1}) Unlock செய்யப்பட்டுள்ளது!
                    </div>
                  )}

                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 grid grid-cols-2 gap-3">
                    <div>
                      <span className="text-[11px] text-slate-500 font-bold uppercase block">மதிப்பெண்</span>
                      <span className="text-2xl font-black text-blue-600">{lastResult.score} / {lastResult.total}</span>
                    </div>
                    <div>
                      <span className="text-[11px] text-slate-500 font-bold uppercase block">சதவீதம்</span>
                      <span className="text-2xl font-black text-purple-600">{lastResult.percentage}%</span>
                    </div>
                  </div>

                  <div className="space-y-2 pt-2">
                    {lastResult.level < 5 && (
                      <button
                        onClick={() => navigateTo("test", activeTopicId, activeDay, lastResult.level + 1)}
                        className="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 text-white rounded-xl text-xs sm:text-sm font-bold shadow transition-colors"
                      >
                        🔓 அடுத்த Level {lastResult.level + 1} தொடங்கு →
                      </button>
                    )}
                    <button
                      onClick={() => navigateTo("levels", activeTopicId, activeDay)}
                      className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-colors"
                    >
                      📋 Levels அட்டவணை
                    </button>
                    <button
                      onClick={() => navigateTo("test", activeTopicId, activeDay, lastResult.level)}
                      className="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl text-xs font-bold border transition-colors"
                    >
                      🔄 மீண்டும் முயற்சி செய்
                    </button>
                    <button
                      onClick={() => navigateTo("home")}
                      className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold transition-colors"
                    >
                      🏠 முகப்புக்கு திரும்பு
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ================= 6. PROGRESS VIEW ================= */}
            {currentView === "progress" && (
              <div className="max-w-3xl mx-auto py-6 animate-fadeIn space-y-5">
                <button
                  onClick={() => navigateTo("home")}
                  className="inline-flex items-center space-x-1.5 text-xs sm:text-sm font-bold text-slate-600 hover:text-blue-600"
                >
                  <span>←</span>
                  <span>முகப்புக்கு திரும்பு</span>
                </button>

                <h1 className="text-2xl font-bold text-slate-900">📊 பாடவாரியான முன்னேற்றம்</h1>

                <div className="space-y-3">
                  {SUBJECTS.map(sub => (
                    <div key={sub.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                      <h3 className="font-bold text-sm text-slate-900 mb-2 flex items-center space-x-2">
                        <span>{sub.icon}</span>
                        <span>{sub.nameTamil}</span>
                      </h3>
                      <div className="space-y-2">
                        {sub.topics.map(t => (
                          <div key={t.id} className="flex justify-between items-center text-xs p-2 bg-slate-50 rounded-lg">
                            <span className="font-semibold text-slate-700">{t.nameTamil}</span>
                            <button
                              onClick={() => navigateTo("levels", t.id, 1)}
                              className="px-3 py-1 bg-slate-900 hover:bg-blue-600 text-white rounded-lg font-bold"
                            >
                              5 Levels பயிற்சி →
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          <footer className="bg-slate-900 text-slate-400 py-6 text-center text-xs border-t border-slate-800">
            <p className="font-bold text-slate-300">🚔 தமிழ்நாடு காவல்துறை SI தேர்வு பயிற்சி தளம்</p>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
