<!DOCTYPE html>
<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🚔 SI TEST — தமிழ்நாடு SI தேர்வு பயிற்சி தளம்</title>
    <meta name="description" content="தமிழ்நாடு காவல்துறை SI தேர்வுக்கான கணிதம் மற்றும் பொது அறிவு தினசரி பயிற்சி தளம்." />
    
    <!-- Google Fonts: Noto Sans Tamil & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      window.addEventListener('error', function(e) {
        if (!document.getElementById('root') || document.getElementById('root').childNodes.length === 0) {
          const div = document.createElement('div');
          div.style = "padding:24px;font-family:sans-serif;background:#fff5f5;color:#991b1b;border:2px solid #f87171;margin:20px;border-radius:12px;";
          div.innerHTML = '<h2 style="margin:0 0 8px 0">⚠️ Page Load Error</h2><p style="margin:0 0 12px 0">' + (e.message || 'Error loading script') + '</p><pre style="background:#fee2e2;padding:12px;border-radius:8px;font-size:12px;overflow:auto">' + (e.filename || '') + ':' + (e.lineno || '') + '</pre><button onclick="localStorage.clear();location.reload();" style="padding:8px 16px;background:#dc2626;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;">Clear Cache & Reload</button>';
          document.body.appendChild(div);
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
